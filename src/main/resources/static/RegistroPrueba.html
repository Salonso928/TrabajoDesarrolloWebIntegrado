<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro - Sabor y Tradición</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 350px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            width: 100%;
            background: #e67e22;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #d35400; }
        .success { color: #27ae60; font-size: 13px; margin-top: 5px; }
        .error { color: #c0392b; font-size: 13px; margin-top: 5px; }
        .link { text-align: center; margin-top: 15px; font-size: 13px; }
        .link a { color: #e67e22; text-decoration: none; }
        .link a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="card">
    <h2>Crear Cuenta</h2>
    <label>Correo electrónico:</label>
    <input type="email" id="reg-email" placeholder="ej. usuario@sabor.com">

    <label>Contraseña:</label>
    <input type="password" id="reg-password" placeholder="••••••••">


    <button onclick="registrar()">Registrarse</button>
    <div id="reg-msg"></div>

    <div class="link">
        ¿Ya tienes una cuenta? <a href="LoginPrueba.html">Inicia sesión</a>
    </div>
</div>

<script>
    function registrar() {
        const email = document.getElementById('reg-email').value;
        const password = document.getElementById('reg-password').value;
        const msgBox = document.getElementById('reg-msg');
        msgBox.innerText = '';
        msgBox.className = '';

        fetch('http://localhost:8080/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password})
        })
            .then(async response => {
                const text = await response.text();
                if (!response.ok) {
                    throw new Error(text || 'Error al registrarse');
                }
                return text;
            })
            .then(data => {
                msgBox.className = 'success';
                msgBox.innerText = '¡Registro exitoso! Redirigiendo al login...';
                setTimeout(() => {
                    window.location.href = 'LoginPrueba.html';
                }, 1500);
            })
            .catch(err => {
                msgBox.className = 'error';
                msgBox.innerText = err.message;
            });
    }
</script>
</body>
</html>
