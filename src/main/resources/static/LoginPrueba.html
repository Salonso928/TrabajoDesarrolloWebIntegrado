<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Login - Sabor y Tradición</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 350px;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0 15px 0;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      width: 100%;
      background: #e67e22;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover { background: #d35400; }
    .hidden { display: none; }
    .token-box {
      background: #f8f9fa;
      padding: 10px;
      word-break: break-all;
      font-size: 11px;
      border: 1px solid #ddd;
      border-radius: 4px;
      margin-top: 5px;
      max-height: 80px;
      overflow-y: auto;
    }
    .error { color: #c0392b; font-size: 13px; margin-top: 5px; }
    .success { color: #27ae60; font-size: 13px; margin-top: 5px; }
    .error { color: #c0392b; font-size: 13px; margin-top: 5px; }
    .link { text-align: center; margin-top: 15px; font-size: 13px; }
    .link a { color: #e67e22; text-decoration: none; }
    .link a:hover { text-decoration: underline; }
  </style>
</head>
<body>

<div class="card">
  <div id="login-section">
    <h2>Iniciar Sesión</h2>
    <label>Correo electrónico:</label>
    <input type="email" id="email" placeholder="ej. admin@sabor.com">

    <label>Contraseña:</label>
    <input type="password" id="password" placeholder="••••••••">

    <button onclick="login()">Entrar</button>
    <div id="error-msg" class="error"></div>
    <div class="link">
      ¿No tienes una cuenta? <a href="RegistroPrueba.html">Regístrate</a>
    </div>
  </div>

  <div id="welcome-section" class="hidden">
    <h2 id="greeting" style="color: #2c3e50; font-size: 20px;"></h2>
    <p><strong>Correo:</strong> <span id="user-email"></span></p>
    <p><strong>Rol:</strong> <span id="user-role"></span></p>
    <p><strong>Token JWT generado:</strong></p>
    <div class="token-box" id="token-display"></div>

    <button onclick="logout()" style="margin-top: 20px; background: #7f8c8d;">Cerrar Sesión</button>
  </div>
</div>

<script>
  function login() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const errorMsg = document.getElementById('error-msg');
    errorMsg.innerText = '';

    fetch('http://localhost:8080/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    })
            .then(async response => {
              if (!response.ok) {
                const text = await response.text();
                throw new Error(text || 'Credenciales incorrectas');
              }
              return response.json();
            })
            .then(data => {
              localStorage.setItem('token', data.token);

              document.getElementById('login-section').classList.add('hidden');
              document.getElementById('welcome-section').classList.remove('hidden');

              document.getElementById('greeting').innerText = `¡Bienvenido ${data.usuario.rol} ${data.usuario.email}!`;
              document.getElementById('user-email').innerText = data.usuario.email;
              document.getElementById('user-role').innerText = data.usuario.rol;
              document.getElementById('token-display').innerText = data.token;
            })
            .catch(err => {
              errorMsg.innerText = err.message;
            });
  }

  function logout() {
    localStorage.removeItem('token');
    document.getElementById('welcome-section').classList.add('hidden');
    document.getElementById('login-section').classList.remove('hidden');
    document.getElementById('email').value = '';
    document.getElementById('password').value = '';
  }
</script>
</body>
</html>
